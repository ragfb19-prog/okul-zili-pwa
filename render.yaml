services:
  - type: web
    name: okul-zili-pwa
    runtime: node
    plan: free
    rootDir: okul-zili-pwa
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: NODE_VERSION
        value: 22

name: Build Android app and widget
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-widget/**'
      - 'okul-zili-pwa/src/App.tsx'
      - '.github/workflows/build-android-widget.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Build debug APK
        working-directory: android-widget
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: okul-zili-android-widget-apk
          path: android-widget/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: okul-zili-widget-v1.1.0
          name: Okul Zili Android Widget v1.1.0
          body: Android uygulaması ve ana ekran ders programı widget'ı.
          files: android-widget/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true

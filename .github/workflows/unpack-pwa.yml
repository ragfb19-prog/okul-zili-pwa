name: Unpack PWA source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Inspect and extract uploaded archive
        shell: bash
        run: |
          set -euxo pipefail
          pwd
          ls -lah
          find . -maxdepth 2 -type f | sort
          ARCHIVE="$(find . -maxdepth 2 -type f -iname '*.zip' | head -n 1)"
          test -n "$ARCHIVE"
          unzip -t "$ARCHIVE"
          mkdir -p /tmp/okul-zili
          unzip -o "$ARCHIVE" -d /tmp/okul-zili
          find /tmp/okul-zili -maxdepth 3 -type f | sort
          cp -a /tmp/okul-zili/. .
          rm -f "$ARCHIVE"
      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract PWA project source"
            git push
          fi
